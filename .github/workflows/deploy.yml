name: Deploy to Github Pages

on:
    push:
        branches: [master]

permissions:
    contents: write

concurrency:
    group: build-and-test
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Check if CV changed
              id: cv-changed
              run: |
                  if [ "$( git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -c "^cv/" )" -gt "0" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Compile CV with Docker
              if: steps.cv-changed.outputs.changed == 'true'
              uses: addnab/docker-run-action@v3
              with:
                  image: thomasweise/docker-texlive-full:latest
                  options: -v ${{ github.workspace }}/cv:/data
                  run: |
                      cd /data
                      pdflatex cv.tex

            - name: Download current CV
              if: steps.cv-changed.outputs.changed != 'true'
              run: wget --no-cache -O ./cv/cv.pdf https://procyk.in/uploads/CV.pdf

            - name: Add CV to webpage sources
              run: mv ./cv/cv.pdf ./static/uploads/CV.pdf

            - uses: actions/setup-go@v2
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: 0.139.3
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./public
                  cname: procyk.in
                  force_orphan: true
